dataSources:
  - kind: ethereum
    name: Bridge
    network: mainnet
    source:
      abi: Bridge
      address: "0x5e4861a80B55f035D899f66772117F00FA0E8e7B"
      startBlock: 16397413
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Deposit
        - Redemption
      abis:
        - name: Bridge
