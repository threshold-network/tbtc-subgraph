name: Deploy Mainnet

# Versioned release: pushing a v* tag on master triggers a build-and-checks
# gate, then pauses for manual approval (the `production` GitHub Environment)
# before deploying to the tbtc-mainnet Studio subgraph. Cut a release with:
#   git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a deploy mid-flight.
concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yaml
    with:
      network: mainnet

  deploy:
    name: Deploy to Graph Studio (mainnet)
    needs: [checks]
    runs-on: ubuntu-latest
    # Requires a reviewer to approve in the `production` environment before
    # this job runs. Configure required reviewers under Settings > Environments
    # > production in the repo — the workflow alone does not name who approves.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Codegen
        run: yarn codegen
      - name: Deploy to Studio
        env:
          GRAPH_DEPLOY_KEY: ${{ secrets.GRAPH_DEPLOY_KEY_MAINNET }}
        run: |
          if [ -z "$GRAPH_DEPLOY_KEY" ]; then
            echo "::error::GRAPH_DEPLOY_KEY_MAINNET secret is not set"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt $attempt"
            set +e
            output=$(npx --no-install graph deploy \
              --studio tbtc-mainnet \
              --deploy-key "$GRAPH_DEPLOY_KEY" \
              --version-label "${{ github.ref_name }}" \
              --network mainnet 2>&1)
            status=$?
            set -e
            echo "$output"
            echo "::endgroup::"
            # graph-cli 0.61.0 can exit 0 even after an uncaught exception
            # (observed in production, deploy-sepolia.yaml: a deploy that
            # failed with "Deploy key not found" plus an UNCAUGHT EXCEPTION
            # trace still returned exit code 0). Trust the exit code AND
            # require the literal success marker graph-cli only prints on
            # its real success path (dist/commands/deploy.js:
            # print.success(`Deployed to ...`)).
            if [ "$status" -eq 0 ] && printf '%s' "$output" | grep -q "Deployed to "; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::All deploy attempts failed"
          exit 1
