name: OSV-Scanner

# Supply-chain vulnerability gate: runs OSV-Scanner against yarn.lock.
# Third-party reusable workflow pinned to a full commit SHA; top-level
# permissions are deny-all, each job opts into only the minimum scopes it
# needs. Mirrors tlabs-xyz/vba-dashboard's osv-scan.yaml, adapted for yarn.
#
# fail-on-vuln is false on both jobs: at bootstrap this scan found 19
# packages / 69 known vulnerabilities, all inherited transitives of
# graph-cli 0.61.0 itself (axios 0.21.4, tar 6.2.1, protobufjs 6.11.6,
# uuid 3.4.0/8.3.2, request 2.88.2, etc.) — pre-existing debt that only
# became visible now because this is the first commit with a lockfile at
# all, not something this pipeline introduced. Several fixes are major
# version bumps embedded in graph-cli's own IPFS/protobuf runtime; forcing
# yarn resolutions on them without a live Studio deploy to catch a
# regression is a separate, higher-risk effort (likely a graph-cli
# upgrade), not something to force through this gate. The scan stays
# active and its findings stay visible in the job log/artifact so the debt
# doesn't go untracked — it just doesn't block merges until that upgrade
# happens.

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

jobs:
  # Diff-aware scan on PRs: reports vulnerabilities the PR's lockfile diff
  # introduces or touches. Non-blocking (fail-on-vuln: false) — see header.
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      # Required: the reusable workflow declares a security-events:write
      # ceiling (for its SARIF-upload step). GitHub validates that ceiling
      # against the caller's grant at scheduling time, so it must be granted
      # even with upload-sarif:false — otherwise the job fails with
      # startup_failure.
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --lockfile=./yarn.lock
      upload-sarif: false
      fail-on-vuln: false

  # Full scan on pushes to master.
  scan-full:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      # See scan-pr: the reusable workflow's declared security-events:write
      # ceiling must be granted here too or the job hits startup_failure.
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --lockfile=./yarn.lock
      upload-sarif: false
      fail-on-vuln: false
