name: OSV-Scanner

# Supply-chain vulnerability gate: runs OSV-Scanner against yarn.lock.
# Third-party reusable workflow pinned to a full commit SHA; top-level
# permissions are deny-all, each job opts into only the minimum scopes it
# needs. Mirrors tlabs-xyz/vba-dashboard's osv-scan.yaml, adapted for yarn.
#
# The Graph CLI upgrade removes the original vulnerable dependency tree.
# Scans remain non-blocking because uuid and stream-json still match
# advisories for APIs this toolchain does not call. Keep findings visible;
# docs/dependency-security.md records the exact exclusions and evidence.

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

jobs:
  # Diff-aware scan on PRs: reports vulnerabilities the PR's lockfile diff
  # introduces or touches. Non-blocking (fail-on-vuln: false) — see header.
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      # Required: the reusable workflow declares a security-events:write
      # ceiling (for its SARIF-upload step). GitHub validates that ceiling
      # against the caller's grant at scheduling time, so it must be granted
      # even with upload-sarif:false — otherwise the job fails with
      # startup_failure.
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --lockfile=./yarn.lock
      upload-sarif: false
      fail-on-vuln: false

  # Full scan on pushes to master.
  scan-full:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      # See scan-pr: the reusable workflow's declared security-events:write
      # ceiling must be granted here too or the job hits startup_failure.
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --lockfile=./yarn.lock
      upload-sarif: false
      fail-on-vuln: false
