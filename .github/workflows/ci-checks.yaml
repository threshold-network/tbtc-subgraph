# Reusable workflow: validates the subgraph compiles for a given network.
# Mapping regression tests run separately in ci.yaml. The compile gate checks
# codegen + graph build for both networks,
# i.e. do schema.graphql, the ABIs, and the AssemblyScript mappings agree.
# Used by ci.yaml (PR + master, both networks) and by deploy-mainnet.yaml's own
# `checks` job (mainnet only, matching that deploy target).
# Cutover checker regression tests run separately in ci.yaml.
name: CI Checks

on:
  workflow_call:
    inputs:
      network:
        description: 'Network to build against (sepolia | mainnet)'
        required: true
        type: string
      node_version:
        type: string
        default: '22'

jobs:
  checks:
    name: Build (${{ inputs.network }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Codegen
        run: yarn codegen
      - name: Build subgraph manifest
        run: yarn run build-${{ inputs.network }}
