# Reusable workflow: validates the subgraph compiles for a given network.
# Codegen + graph build verify schema, ABIs, and mappings agree. The mainnet
# check also runs the mapping regression tests.
# Used by ci.yaml (PR + master, both networks) and by deploy-mainnet.yaml's own
# `checks` job (mainnet only, matching that deploy target).
# Cutover, guarded-call, and DKG handler regression tests run separately in ci.yaml.
name: CI Checks

on:
  workflow_call:
    inputs:
      network:
        description: 'Network to build against (sepolia | mainnet)'
        required: true
        type: string
      node_version:
        type: string
        default: '22'

jobs:
  checks:
    name: Build (${{ inputs.network }})
    # Matchstick 0.6.0 provides a native Ubuntu 22 binary.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Codegen
        run: yarn codegen
      - name: Build subgraph manifest
        run: yarn run build-${{ inputs.network }}
      - name: Check deposit divisor event ordering
        if: inputs.network == 'mainnet'
        run: node --experimental-vm-modules --test scripts/check-deposit-divisor.test.mjs
      - name: Test mappings
        if: inputs.network == 'mainnet'
        run: yarn test
      - name: Check toolchain security and deployment compatibility
        if: inputs.network == 'mainnet'
        run: node --test scripts/check-toolchain.test.mjs
