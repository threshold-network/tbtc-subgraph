name: CI

on:
  pull_request:
  push:
    branches: [master]

# Deny-all baseline: every job here performs read-only validation.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cutover-tests:
    name: Cutover checker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test cutover checker
        run: node --test scripts/check-cutover.test.mjs
  checks:
    strategy:
      matrix:
        network: [sepolia, mainnet]
    uses: ./.github/workflows/ci-checks.yaml
    with:
      network: ${{ matrix.network }}
